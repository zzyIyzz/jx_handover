name: jx-handover

services:
  app:
    image: jx-handover:0.5.0
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    restart: unless-stopped
    env_file:
      - ${JX_CONTAINER_ENV_FILE:-.env}
    environment:
      JX_HANDOVER_DATA_DIR: /var/lib/jx-handover
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${JX_HOST_DATA_DIR:-/www/jx-handover/data}
        target: /var/lib/jx-handover
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.parse, urllib.request; public = urllib.parse.urlsplit(os.environ['JX_PUBLIC_URL']); request = urllib.request.Request('http://127.0.0.1:8765/api/health', headers={'Host': public.netloc}); urllib.request.urlopen(request, timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
